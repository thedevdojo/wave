name: Pest Tests

on:
  push:
    branches:
      - main
      - 3.x
  pull_request:
    branches: [ main ]
  # nightly on main, so upstream package releases that break us show up here first
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  installer-manual:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
    - uses: actions/checkout@v7
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: pdo_sqlite
    
    - name: Create project directory
      run: mkdir project_folder

    - name: Download tarball of current commit
      run: |
        TARBALL_URL=$(curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                      -H "Accept: application/vnd.github.v3+json" \
                      https://api.github.com/repos/${{ github.repository }}/tarball/${{ github.sha }} \
                      -I | grep -i "location:" | cut -d " " -f 2 | tr -d '\r')
        curl -L -o wave.tar.gz $TARBALL_URL

    - name: Extract tarball to project directory
      run: tar -xzf wave.tar.gz -C project_folder --strip-components=1

    - name: Debug - List contents of project directory
      run: |
        echo "Contents of project_folder directory:"
        ls -la project_folder
        echo "Contents of project_folder/public directory (if it exists):"
        ls -la project_folder/public || echo "Public directory not found"

    - name: Copy .env.example file
      run: |
        cd project_folder
        cp .env.example .env

    - name: Create SQLite database
      run: |
        cd project_folder
        touch database/database.sqlite

    - name: Install Composer Dependencies
      run: |
        cd project_folder
        composer install

    - name: Audit Composer dependencies
      if: matrix.php == '8.3'
      run: |
        cd project_folder
        composer audit --abandoned=report

    - name: Generate application key
      run: |
        cd project_folder
        php artisan key:generate

    - name: Database Migrations and Seed
      run: |
        cd project_folder
        php artisan migrate
        php artisan db:seed

    - name: Start Laravel server
      run: |
        cd project_folder
        php artisan serve &
        echo $! > laravel_server.pid

    - name: Wait for server to start
      run: sleep 5

    - name: Execute tests (Unit and Feature tests) via PestPHP
      run: |
        cd project_folder
        ./vendor/bin/pest

    - name: Stop Laravel server
      if: always()
      run: kill $(cat project_folder/laravel_server.pid)

  databases:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            port: 3306
            username: root
          - db: pgsql
            port: 5432
            username: postgres

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wave
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: wave
        ports: ['5432:5432']
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: pdo_mysql, pdo_pgsql

    - name: Install Composer Dependencies
      run: |
        cp .env.example .env
        composer install --no-interaction --no-progress
        php artisan key:generate

    # phpunit.xml pins tests to in-memory SQLite, so point a copy at the service instead
    - name: Point the tests at ${{ matrix.db }}
      run: |
        sed -e 's#<env name="DB_CONNECTION" value="sqlite" force="true"/>#<env name="DB_CONNECTION" value="${{ matrix.db }}" force="true"/><env name="DB_HOST" value="127.0.0.1" force="true"/><env name="DB_PORT" value="${{ matrix.port }}" force="true"/><env name="DB_USERNAME" value="${{ matrix.username }}" force="true"/><env name="DB_PASSWORD" value="password" force="true"/>#' \
            -e 's#<env name="DB_DATABASE" value=":memory:" force="true"/>#<env name="DB_DATABASE" value="wave" force="true"/>#' \
            phpunit.xml > phpunit.${{ matrix.db }}.xml
        grep -q '"${{ matrix.db }}"' phpunit.${{ matrix.db }}.xml

    - name: Run the tests on ${{ matrix.db }}
      run: ./vendor/bin/pest -c phpunit.${{ matrix.db }}.xml
