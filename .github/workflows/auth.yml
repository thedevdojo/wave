name: Authentication Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, mysql

    - name: Cache Composer Packages
      uses: actions/cache@v6
      with:
        path: ~/.composer/cache
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-git

    - name: Install Dependencies
      run: composer install --no-progress --prefer-dist

    - name: Copy .env file
      run: cp .env.example .env

    - name: Generate application key
      run: php artisan key:generate

    - name: Configure environment for SQLite
      run: |
        sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
        sed -i 's/^DB_DATABASE=laravel/#DB_DATABASE=laravel/' .env

    - name: Replace current tests with the DevDojo Auth tests
      run: |
        rm -rf tests
        cp -r vendor/devdojo/auth/tests tests
        # devdojo/auth's tests/Pest.php declares its `use` imports below the code that needs them,
        # so DuskTestCase/TestCase don't resolve. Hoist the imports to the top of the file.
        php -r '$f = "tests/Pest.php"; $s = file_get_contents($f); preg_match_all("/^use [^;(]+;\n/m", $s, $m); $s = preg_replace("/^use [^;(]+;\n/m", "", $s); file_put_contents($f, preg_replace("/^<\?php\n/", "<?php\n\n".implode("", $m[0]), $s, 1));'
        # This test uses the package's own User model against a vanilla users table,
        # which doesn't match Wave's schema (username is required).
        rm -f tests/Feature/EmailVerificationCodeTest.php

    - name: Create sqlite file
      run: touch database/database.sqlite

    - name: Run the migrations
      run: php artisan migrate --force

    - name: Run the Auth Migrations
      run: php artisan migrate --path=vendor/devdojo/auth/database/migrations --force

    - name: Install PestPHP
      run: composer require pestphp/pest --dev --with-all-dependencies

    - name: Run Tests
      run: ./vendor/bin/pest
