name: Frontend

on:
  push:
    branches:
      - main
      - 3.x
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # low/moderate advisories in build tooling are left to dependabot
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build assets
        run: npm run build
